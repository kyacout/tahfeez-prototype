<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظومة حلقات التحفيظ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: fixed module rail on the right (RTL) + scrolling work area; cards only mark working panels */
:root{
 --bg:#EDF0EA;--surface:#FBFCF9;--sunk:#E4E9E2;--ink:#14302A;--muted:#5A6D66;--line:#D3DCD4;
 --accent:#1E6A58;--accent-ink:#FFFFFF;--accent-soft:#DCEBE5;--gold:#94731F;--gold-soft:#F2E8CB;
 --c3:#3F6696;--c3-soft:#DEE7F2;
 --yel:#7F6A00;--yel-soft:#F6F0C4;--ok:#2D7A4C;--ok-soft:#DDEFE3;--warn:#9E6814;--warn-soft:#F7EAD2;--bad:#B03E37;--bad-soft:#F6DEDB;
 --side:#11302A;--side-ink:#E6EFEA;--side-muted:#93ADA4;--side-hi:#1C4A3F;
 --f-display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
 --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif;
 --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0D1614;--surface:#14201D;--sunk:#101B18;--ink:#E2EBE6;--muted:#90A59D;--line:#25362F;
 --accent:#5DB89F;--accent-ink:#06231C;--accent-soft:#18352D;--gold:#D6B25C;--gold-soft:#342C17;
 --c3:#86A9D9;--c3-soft:#1A2738;
 --yel:#E2CF5A;--yel-soft:#33300F;--ok:#62C48D;--ok-soft:#16301F;--warn:#E3AA4F;--warn-soft:#352813;--bad:#E77D72;--bad-soft:#3A1C19;
 --side:#0A1311;--side-ink:#DCE7E2;--side-muted:#7F968E;--side-hi:#163A31;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0D1614;--surface:#14201D;--sunk:#101B18;--ink:#E2EBE6;--muted:#90A59D;--line:#25362F;
 --accent:#5DB89F;--accent-ink:#06231C;--accent-soft:#18352D;--gold:#D6B25C;--gold-soft:#342C17;
 --c3:#86A9D9;--c3-soft:#1A2738;
 --yel:#E2CF5A;--yel-soft:#33300F;--ok:#62C48D;--ok-soft:#16301F;--warn:#E3AA4F;--warn-soft:#352813;--bad:#E77D72;--bad-soft:#3A1C19;
 --side:#0A1311;--side-ink:#DCE7E2;--side-muted:#7F968E;--side-hi:#163A31;color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{direction:rtl;text-align:right}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.65rem}h2{font-size:1.1rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:600;white-space:nowrap}
.brand svg{flex:none}
.demo{font-size:.72rem;background:var(--gold-soft);color:var(--gold);padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who .nm{font-size:.82rem;color:var(--muted);white-space:nowrap}
.who select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-weight:600}
.menu{display:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;cursor:pointer}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 58px)}
.side{background:var(--side);color:var(--side-ink);padding:14px 10px 30px;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));height:calc(100vh - 58px);overflow-y:auto}
.side .g{font-size:.72rem;letter-spacing:.04em;color:var(--side-muted);padding:14px 10px 4px;font-weight:600}
.side a{display:flex;align-items:center;gap:8px;color:var(--side-ink);text-decoration:none;padding:7px 10px;border-radius:8px;font-size:.9rem}
.side a:hover{background:var(--side-hi)}
.side a.on{background:var(--side-hi);box-shadow:inset -3px 0 0 var(--gold)}
.side a .mn{font-size:.7rem;color:var(--side-muted);min-width:20px;font-variant-numeric:tabular-nums}
.side a .bd{margin-inline-start:auto;background:var(--gold);color:var(--side);font-size:.7rem;border-radius:99px;padding:0 7px;font-weight:700}
.side .scope{margin:6px 6px 0;padding:10px;border:1px dashed var(--side-hi);border-radius:8px;font-size:.78rem;color:var(--side-muted)}
.side .scope b{color:var(--side-ink);display:block;font-weight:600}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.vh>div:first-child{min-width:0}
.eyebrow{font-size:.75rem;color:var(--gold);font-weight:700;letter-spacing:.03em}
.sub{color:var(--muted);margin:4px 0 0;max-width:68ch}
.scopechip{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:99px;margin-top:8px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h2{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 small{font-family:var(--f-body);font-size:.78rem;color:var(--muted);font-weight:400}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g21{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:3px solid var(--line)}
.kpi.ok{border-top-color:var(--ok)}.kpi.warn{border-top-color:var(--warn)}.kpi.bad{border-top-color:var(--bad)}.kpi.ac{border-top-color:var(--accent)}.kpi.gd{border-top-color:var(--gold)}
.kpi .l{font-size:.78rem;color:var(--muted)}
.kpi .v{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .s{font-size:.75rem;color:var(--muted)}
.muted{color:var(--muted)}.sm{font-size:.78rem}
.chip{display:inline-block;font-size:.74rem;padding:1px 9px;border-radius:99px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--c3-soft);color:var(--c3)}.chip.gold{background:var(--gold-soft);color:var(--gold)}.chip.ac{background:var(--accent-soft);color:var(--accent)}.chip.yel{background:var(--yel-soft);color:var(--yel)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{color:var(--ok);border-color:var(--ok)}.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);min-width:0}
.fld.grow{flex:1 1 200px}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;color:var(--ink);font-size:.88rem;min-width:0;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
.t th{text-align:start;background:var(--sunk);color:var(--muted);font-weight:600;font-size:.78rem;padding:8px 10px;white-space:nowrap;cursor:pointer;user-select:none}
.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.t .num{font-variant-numeric:tabular-nums}
.t tr.clk{cursor:pointer}.t tr.clk:hover td{background:var(--accent-soft)}
.t tr.sel td{background:var(--accent-soft)}
.t tr.sev-bad td:first-child{box-shadow:inset -4px 0 0 var(--bad)}
.t tr.sev-warn td:first-child{box-shadow:inset -4px 0 0 var(--warn)}
.t tr.sev-yel td:first-child{box-shadow:inset -4px 0 0 var(--yel)}
.t tr.sev-info td:first-child{box-shadow:inset -4px 0 0 var(--c3)}
.empty{text-align:center;color:var(--muted);padding:22px!important}
.pb{display:block;height:7px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:70px}
.pb i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pb.gd i{background:var(--gold)}.pb.warn i{background:var(--warn)}.pb.bad i{background:var(--bad)}
.bars{display:flex;flex-direction:column;gap:9px}
.br{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:.84rem}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bt i.gd{background:var(--gold)}.bt i.warn{background:var(--warn)}.bt i.bad{background:var(--bad)}
.bv{font-variant-numeric:tabular-nums;text-align:end}
.chartbox{min-width:0}
.chart{width:100%;height:auto;direction:ltr;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ln.s1{stroke:var(--accent)}.ln.s2{stroke:var(--gold)}.ln.s3{stroke:var(--c3)}
.dot.s1{fill:var(--accent)}.dot.s2{fill:var(--gold)}.dot.s3{fill:var(--c3)}
.area.s1{fill:var(--accent);opacity:.12}.area.s2{fill:var(--gold);opacity:.14}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.sw{display:inline-block;width:12px;height:3px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.sw.s1{background:var(--accent)}.sw.s2{background:var(--gold)}.sw.s3{background:var(--c3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:.88rem}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;font-weight:500}
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.av{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;flex:none}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;border-inline-start:2px solid var(--line);padding-inline-start:14px}
.tl li{position:relative;font-size:.86rem}
.tl li::before{content:"";position:absolute;inset-inline-start:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .d{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:92px;height:92px;flex:none}
.ring .rt{stroke:var(--sunk)}.ring .rv{stroke:var(--gold)}
.ring text{fill:var(--ink);font-family:var(--f-body);font-weight:700}
.lcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.lc.abs{opacity:.62}
.lc-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:8px 2px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on.p{background:var(--ok-soft);color:var(--ok)}.seg button.on.a{background:var(--bad-soft);color:var(--bad)}.seg button.on.l{background:var(--warn-soft);color:var(--warn)}.seg button.on.e{background:var(--c3-soft);color:var(--c3)}
.lc-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lc-g .fld input,.lc-g .fld select{padding:7px 6px;text-align:center}
.stick{position:sticky;bottom:12px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem}
.stats b{font-variant-numeric:tabular-nums}
.stagecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sc{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.sc .n{font-size:.74rem;color:var(--gold);font-weight:700}
.sc h3{font-size:.98rem}
.sc .m{font-size:.8rem;color:var(--muted)}
.receipt{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px;background-image:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 14px);background-size:100% 3px;background-repeat:no-repeat}
.rc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.rc-no{text-align:end;display:flex;flex-direction:column}
.rc-no b{font-variant-numeric:tabular-nums;direction:ltr}
.kufi{font-family:var(--f-display);font-size:1.05rem}
.rc-amt{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.rc-amt b{font-size:1.3rem;color:var(--accent);font-variant-numeric:tabular-nums}
.rc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stamp{border:2px solid var(--gold);color:var(--gold);border-radius:6px;padding:2px 10px;font-weight:700;font-size:.78rem;transform:rotate(-4deg)}
.note{background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:.84rem}
.deny{text-align:center;padding:50px 20px}
.deny h2{margin:10px 0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.list li:first-child{border-top:0}
.ck{color:var(--ok);font-weight:700}.x{color:var(--line)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.split{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:980px){.g3{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1fr}}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .menu{display:block}
 .side{display:none;position:fixed;top:calc(57px + env(safe-area-inset-top,0px));left:0;right:0;height:auto;max-height:70vh;z-index:19;box-shadow:0 14px 30px rgba(0,0,0,.25);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
 .side.open{display:block}
 .who .nm{display:none}
}
@media (max-width:640px){
 .g2,.g3{grid-template-columns:1fr}
 .demo{display:none}
 h1{font-size:1.35rem}
 .lc-g{grid-template-columns:1fr 1fr}
 .lcs{grid-template-columns:1fr}
 .br{grid-template-columns:90px minmax(0,1fr) 42px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="top">
 <button class="menu" id="menu" aria-label="القائمة">☰ الوحدات</button>
 <div class="brand">
  <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><g fill="none" stroke="var(--gold)" stroke-width="2"><rect x="7" y="7" width="16" height="16"/><rect x="7" y="7" width="16" height="16" transform="rotate(45 15 15)"/></g><circle cx="15" cy="15" r="3" fill="var(--accent)"/></svg>
  <b>منظومة حلقات التحفيظ</b>
  <span class="demo">بيانات تجريبية</span>
 </div>
 <span class="sp"></span>
 <div class="who"><span class="nm" id="uname"></span>
  <label class="sr" for="role" style="position:absolute;width:1px;height:1px;overflow:hidden">الدور</label>
  <select id="role" aria-label="تبديل الدور">
   <option value="admin">الإدارة العليا</option><option value="manager">مدير فرع</option><option value="supervisor">مشرف</option><option value="teacher">معلم</option><option value="accountant">محاسب</option><option value="parent">ولي أمر</option>
  </select></div>
</header>
<div class="app">
 <nav class="side" id="side" aria-label="الوحدات"></nav>
 <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let seed=20261108;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)), pick=a=>a[Math.floor(rnd()*a.length)];
const TODAY=new Date(2026,10,8,0,0,0);
const addDays=(d,n)=>new Date(d.getTime()+n*864e5), diffDays=(a,b)=>Math.round((a-b)/864e5);
const p2=n=>String(n).padStart(2,'0');
const fd=d=>`${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())}`;
const CUR='ر.س', money=n=>Math.round(n).toLocaleString('en-US')+' '+CUR;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0, sum=a=>a.reduce((x,y)=>x+y,0);
let HIJRI='';try{HIJRI=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(TODAY)}catch(e){}

function lineChart(series,labels,o={}){
 const W=560,H=o.h||180,pl=36,pr=16,pt=14,pb=26,min=o.min??0,max=o.max??100,n=labels.length;
 const X=i=>pl+(W-pl-pr)*(n<2?.5:i/(n-1)),Y=v=>pt+(H-pt-pb)*(1-(Math.max(min,v)-min)/(max-min));
 let g='';for(let k=0;k<=4;k++){const v=min+(max-min)*k/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="gl"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="ax">${Math.round(v)}</text>`}
 const step=Math.ceil(n/7);labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle" class="ax">${l}</text>`});
 series.forEach(s=>{const pts=s.v.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  if(series.length===1)g+=`<path d="M${pts.join(' L')} L${X(n-1)},${Y(min)} L${X(0)},${Y(min)}Z" class="area ${s.c}"/>`;
  g+=`<polyline points="${pts.join(' ')}" class="ln ${s.c}"/><circle cx="${X(n-1)}" cy="${Y(s.v[n-1])}" r="4" class="dot ${s.c}"/>`});
 const lg=series.length>1?`<div class="legend">${series.map(s=>`<span><i class="sw ${s.c}"></i>${s.l}</span>`).join('')}</div>`:'';
 return `<div class="chartbox">${lg}<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${o.label||'رسم بياني'}">${g}</svg></div>`}
const bars=(items,o={})=>`<div class="bars">${items.map(it=>`<div class="br"><span class="bl" title="${it.l}">${it.l}</span><span class="bt"><i class="${it.c||''}" style="width:${Math.max(2,Math.min(100,it.v/(o.max||100)*100))}%"></i></span><b class="bv">${o.fmt?o.fmt(it.v):Math.round(it.v)+'%'}</b></div>`).join('')}</div>`;
function ring(v,max,label){const r=38,c=2*Math.PI*r,f=Math.min(1,v/max);return `<svg viewBox="0 0 92 92" role="img" aria-label="${label}"><circle cx="46" cy="46" r="${r}" fill="none" stroke-width="9" class="rt"/><circle cx="46" cy="46" r="${r}" fill="none" stroke-width="9" class="rv" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 46 46)"/><text x="46" y="51" text-anchor="middle" font-size="16">${v}</text></svg>`}

  TR.unshift(t);U.tr='all';audit('رفع طلب '+y,'طلب '+t.id+' · '+s.name);toast('رُفع الطلب '+t.id+' بانتظار الاعتماد');render()},
 pay:()=>{const s=stu($('#py-s').value);if(!s){toast('لا يوجد طلاب عليهم مستحقات');return}const a=+$('#py-a').value;if(!(a>0)){toast('أدخل مبلغاً أكبر من صفر');return}
  const p={no:Math.max(...PAY.map(p=>p.no))+1,date:TODAY,sid:s.id,amount:a,method:$('#py-m').value,month:'نوفمبر',by:R().user};PAY.push(p);U.rcNo=p.no;audit('إصدار إيصال','R-2026-'+p.no+' · '+s.name+' · '+money(a));toast('صدر الإيصال R-2026-'+p.no);render()},
 exp:()=>{const a=+$('#xp-a').value;if(!(a>0)){toast('أدخل مبلغاً صحيحاً');return}EXP.unshift({date:TODAY,br:+$('#xp-b').value,cat:$('#xp-c').value,amount:a});audit('تسجيل مصروف',$('#xp-c').value+' · '+money(a));toast('سُجّل المصروف');render()},
 inquiry:()=>{audit('استفسار ولي أمر',$('#iq-s').value+' · '+stu(U.child).fn);toast('وصل استفسارك إلى المشرف، وسيصلك الرد في البوابة')},
 behavior:()=>{const s=stu(U.child);s.beh.parent=$('#bh-r').value;s.notes.unshift({d:TODAY,t:'رأي ولي الأمر: '+$('#bh-r').value+' – '+$('#bh-n').value,by:'ولي الأمر'});audit('تسجيل رأي ولي الأمر في السلوك',s.name);toast('شكراً لك، سُجّل رأيك في ملف '+s.fn);render()}};

document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(a&&a.tagName!=='SELECT'){e.preventDefault();ACT[a.dataset.act]?.(a.dataset.id);return}
 const th=e.target.closest('table.t[data-tid] th[data-k]');if(th&&!th.dataset.ns){const id=th.closest('table').dataset.tid,k=th.dataset.k,ss=sortState[id];sortState[id]=ss&&ss.k===k?{k,dir:-ss.dir}:{k,dir:1};(redraw||render)();return}
 const tr=e.target.closest('tr[data-go]');if(tr){const g=tr.dataset.go;if(g.startsWith('act:')){const[,n,v]=g.split(':');ACT[n](v)}else location.hash=g.slice(1)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('th[data-k]'))e.target.click()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.actChange){ACT[t.dataset.actChange](t.value)}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.f){F[t.dataset.f]=t.value;redraw&&redraw();return}
 if(t.dataset.dl){const[s,k]=t.dataset.dl.split(':');let v=t.value;if(k==='h'||k==='r'){v=Math.max(0,Math.min(10,+v||0));}DLOG[U.dHq][s][k]=k==='n'||k==='b'?t.value:v;paintDaily();return}
 if(t.dataset.ev){const f=EVF[U.evS],[k,i]=t.dataset.ev.split(':');if(k==='w')f.items[i].w=+t.value||0;else if(k==='v'){f.items[i].v=+t.value;$('#evo'+i).textContent=t.value}else f[k]=t.value;paintEval();return}
 if(t.dataset.tg!==undefined){const rows=targetRows(U.tgL,U.tgP),r=rows[+t.dataset.tg];r.t=Math.max(1,+t.value||1);const c=tgCells(r),tr=t.closest('tr');['p','d','rem'].forEach(x=>tr.querySelector(`[data-c="${x}"]`).innerHTML=c[x])}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f){e.preventDefault();FORMS[f.dataset.form]?.()}});
render(true);
</script>
